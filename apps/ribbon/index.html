<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ribbon World</title>
  <link rel="stylesheet" href="harness/harness.css">
  <link rel="stylesheet" href="trainer.css">
  <!-- The hub's look over the harness's, loaded last so it wins. -->
  <link rel="stylesheet" href="hub-skin.css">
</head>
<body>
  <div id="app"></div>
  <script src="harness/record.js"></script>
  <script src="harness/harness.js"></script>
  <script src="world.js"></script>
  <script src="trainer.js"></script>
<!-- The hub's colour slider. Absent outside the built site, and then the skin's sage stands. -->
<script src="../shared/theme.js?v=1"></script>
<script>
if (window.HubTheme) HubTheme.follow(document.documentElement, function (p) {
  var T = HubTheme;
  return {
    '--h-bg': T.hex(p.bg), '--h-panel': T.hex(p.panel), '--h-panel-hi': T.hex(p.panelHi),
    '--h-ink': T.hex(p.ink), '--h-ink-strong': T.hex(p.inkStrong), '--h-dim': T.hex(p.dim),
    '--h-accent': T.hex(p.accent), '--h-accent-2': T.hex(p.accent2), '--h-ok': T.hex(p.ok),
    '--h-line': T.rgba(p.accent, .30), '--h-line-soft': T.rgba(p.accent, .13),
  };
});
</script>
</body>
</html>
